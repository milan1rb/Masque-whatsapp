name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee /tmp/build.log || echo "BUILD_FAILED" >> /tmp/build.log
      - name: Publier le journal de compilation
        if: always()
        run: |
          tail -c 60000 /tmp/build.log > buildlog.txt
          git config user.name ci
          git config user.email ci@example.com
          git add -f buildlog.txt
          git commit -m "journal de compilation" || true
          git push origin HEAD:buildlog --force
      - name: Verifier
        run: grep -q BUILD_FAILED /tmp/build.log && exit 1 || true
      - run: cp build/outputs/apk/debug/*.apk WaMasque.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WaMasque-apk
          path: WaMasque.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WA Masque (build ${{ github.run_number }})
          files: WaMasque.apk
          make_latest: true
