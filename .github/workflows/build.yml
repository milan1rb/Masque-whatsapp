name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - run: cp build/outputs/apk/debug/*.apk WaMasque.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WaMasque-apk
          path: WaMasque.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WA Masque (build ${{ github.run_number }})
          files: WaMasque.apk
          make_latest: true
